<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" width="100%" height="100%">
  <!-- Official HIMA Stelato (享界) Universe Star Crest -->
  <g fill="none" stroke="#16232d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Shield Border -->
    <path d="M 50 8 C 58 8 94 38 94 52 L 94 188 C 94 202 58 232 50 232 C 42 232 6 202 6 188 L 6 52 C 6 38 42 8 50 8 Z" stroke-width="4.5" />

    <!-- Slender Cosmic Spine -->
    <path d="M 50 12 L 50 108 M 50 132 L 50 228" stroke-width="2.5" />

    <!-- Top Starburst Radiating Arcs -->
    <path d="M 50 14 Q 50 70 16 108" stroke-width="1.8" />
    <path d="M 50 14 Q 50 70 84 108" stroke-width="1.8" />
    <path d="M 50 40 Q 48 85 30 108" stroke-width="1.5" />
    <path d="M 50 40 Q 52 85 70 108" stroke-width="1.5" />
    <path d="M 50 65 L 42 108" stroke-width="1.5" />
    <path d="M 50 65 L 58 108" stroke-width="1.5" />

    <!-- Bottom Starburst Radiating Arcs (Mirror) -->
    <path d="M 50 226 Q 50 170 16 132" stroke-width="1.8" />
    <path d="M 50 226 Q 50 170 84 132" stroke-width="1.8" />
    <path d="M 50 200 Q 48 155 30 132" stroke-width="1.5" />
    <path d="M 50 200 Q 52 155 70 132" stroke-width="1.5" />
    <path d="M 50 175 L 42 132" stroke-width="1.5" />
    <path d="M 50 175 L 58 132" stroke-width="1.5" />

    <!-- Center Horizontal Bar -->
    <rect x="6" y="108" width="88" height="24" fill="#16232d" stroke="none" />
  </g>
  <!-- STELATO Wordmark in Central Bar -->
  <text x="50" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="10.5" letter-spacing="2.2" text-anchor="middle">STELATO</text>
</svg>
