<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" width="100%" height="100%">
  <!-- Official HIMA Maextro (尊界) Sovereign Faceted Diamond Crest -->
  <g fill="none" stroke="#16232d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Diamond Shield Border -->
    <polygon points="50,6 94,52 94,188 50,234 6,188 6,52" stroke-width="4.5" />

    <!-- Central Diamond Wireframe Lines (Top Half) -->
    <line x1="50" y1="6" x2="50" y2="108" stroke-width="2" />
    <line x1="6" y1="52" x2="50" y2="108" stroke-width="1.8" />
    <line x1="94" y1="52" x2="50" y2="108" stroke-width="1.8" />
    <line x1="50" y1="6" x2="28" y2="108" stroke-width="1.8" />
    <line x1="50" y1="6" x2="72" y2="108" stroke-width="1.8" />
    <line x1="6" y1="52" x2="28" y2="108" stroke-width="1.5" />
    <line x1="94" y1="52" x2="72" y2="108" stroke-width="1.5" />

    <!-- Central Diamond Wireframe Lines (Bottom Half - Mirror) -->
    <line x1="50" y1="234" x2="50" y2="132" stroke-width="2" />
    <line x1="6" y1="188" x2="50" y2="132" stroke-width="1.8" />
    <line x1="94" y1="188" x2="50" y2="132" stroke-width="1.8" />
    <line x1="50" y1="234" x2="28" y2="132" stroke-width="1.8" />
    <line x1="50" y1="234" x2="72" y2="132" stroke-width="1.8" />
    <line x1="6" y1="188" x2="28" y2="132" stroke-width="1.5" />
    <line x1="94" y1="188" x2="72" y2="132" stroke-width="1.5" />

    <!-- Center Horizontal Bar Frame -->
    <rect x="6" y="108" width="88" height="24" fill="#ffffff" stroke="#16232d" stroke-width="2.5" />
  </g>
  <!-- MAEXTRO Wordmark in Central Bar -->
  <text x="50" y="125" fill="#16232d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="10.5" letter-spacing="2.2" text-anchor="middle">MAEXTRO</text>
</svg>
