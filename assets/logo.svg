  </style>
  <g class="ly-grp" transform="translate(50, 50) scale(0.82) translate(-50, -50) skewX(-14) translate(12, 0)">
    <path class="ly-shape-l" d="M 20 18 H 35 V 67 H 67 V 82 H 20 Z" rx="2"/>
    <path class="ly-shape-y" d="M 43 18 H 58 L 69 43 L 80 18 H 95 L 76 57 V 82 H 62 V 57 Z" rx="2"/>
