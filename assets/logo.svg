<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ly-l-light" x1="20" y1="18" x2="60" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ly-y-light" x1="45" y1="18" x2="90" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ly-l-dark" x1="20" y1="18" x2="60" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ly-y-dark" x1="45" y1="18" x2="90" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="ly-glow-auto" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#10b981" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    .ly-shape-l { fill: url(#ly-l-light); }
