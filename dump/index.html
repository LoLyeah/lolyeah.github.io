<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoLyeah Dump — Experiments &amp; Scratchpad</title>
    <meta name="description" content="A personal repository of random experiments, utilities, reference notes, and scratchpad scripts.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-surface: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-light: #e2e8f0;
            --accent: #059669;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        [data-theme="dark"] {
            --bg-primary: #090d16;
            --bg-surface: #111827;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-light: #1e293b;
            --accent: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 3rem 2rem;
        }
        .mono-tag {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
            display: inline-block;
        }
        h1 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }
        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .back-link:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <span class="mono-tag">LABORATORY // EXPERIMENTAL</span>
        <h1>LoLyeah Dump</h1>
        <p>Personal laboratory archive containing scratchpads, experimental interactive widgets, algorithmic prototypes, and raw computational notes.</p>
        <a href="../index.html" class="back-link">&larr; Return to Main Compendium</a>
    </div>
</body>
</html>
